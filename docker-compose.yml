services:

  # ── Servizio base: CPU ───────────────────────────────────
  jupyterlab-wsl-base:
    build: .
    ports:
      - "0.0.0.0:8888:8888"
    volumes:
      # Supporto driver WSL di Windows
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OV_LOG_LEVEL=WARNING
      - MODEL_PATH=/workspace/models/tinyllama-chat-ov
      - OV_DEVICE=CPU
    restart: unless-stopped
 
  # Servizio per amministrare Jupyter, scaricare modelli AI
  # e lavorare sui notebook del professore
  jupyterlab-wsl-prof:
    extends:
      service: jupyterlab-wsl-base
    volumes:
      - ./models:/workspace/models
      - ./prof:/workspace/prof
      - ./studenti:/workspace/studenti

  # Servizio per consentire agli studenti di lavorare sui
  # propri notebook e avere accesso ai modelli AI in sola lettura
  jupyterlab-wsl-studenti:
    extends:
      service: jupyterlab-wsl-base
    volumes:
      - ./models:/workspace/models:ro
      - ./studenti:/workspace/studenti

  # ── Profilo GPU: aggiunge /dev/dxg (bridge WSL2-DirectX) ─
  jupyterlab-gpu-base:
    extends:
      service: jupyterlab-wsl-base
    container_name: openvino_jupyter_gpu
    profiles: [gpu]
    group_add:
      # Permessi (Group ID) per accedere ai device GPU
      - "44"    # video
      - "992"  # render
    devices:
      # /dev/dxg è il device virtuale creato da WSL2
      # per esporre la GPU Windows al sottosistema Linux.
      # Viene creato automaticamente se il driver Intel
      # su Windows è >= 30.0.100.9955
      - /dev/dxg:/dev/dxg
    environment:
      - PYTHONUNBUFFERED=1
      - OV_LOG_LEVEL=WARNING
      - MODEL_PATH=/workspace/models/tinyllama-chat-ov
      - OV_DEVICE=GPU
